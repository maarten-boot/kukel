name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        go: ["1.25.x", "stable"]   # the go.mod minimum and the current release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0           # tags, for the version kukel reports
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Vet (gofmt and go vet)
        run: make vet
      - name: Test
        run: make test
      - name: Test the smallest build (build tags)
        run: make test-small && make small && ./bin/kukel-small version
      - name: Build
        run: make build && ./bin/kukel version
      - name: Fuzz briefly
        run: make fuzz FUZZTIME=10s
