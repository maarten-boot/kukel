name: CI

on:
  push:
    branches: ["**"]               # tags run it through release.yml
  pull_request:
  workflow_call:                   # release.yml: a release only after these pass

# The actions are pinned to commits (the version in the comment), so that a
# moved tag cannot change what runs; Dependabot proposes updates.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ["1.25.x", "stable"]   # the go.mod minimum and the current release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0           # tags, for the version kukel reports
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Vet (gofmt and go vet)
        run: make vet
      - name: Lark, for the test of syntax.lark (TestLarkGrammar)
        run: python3 -m pip install --user --break-system-packages lark
      - name: Test
        run: make test
      - name: Test the smallest build (build tags)
        run: make test-small && make small && ./bin/kukel-small version
      - name: Test the tk build (windows on Xvfb, clicked with xdotool)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xdotool
          make test-tk && make tk && ./bin/kukel-tk version
      - name: Build
        run: make build && ./bin/kukel version
      - name: Fuzz briefly
        run: make fuzz FUZZTIME=10s
      # A fuzz test that fails (or whose watchdog stops a program that runs
      # on: internal/bytecode runFuzzed) leaves its input in testdata/fuzz:
      # the new files are printed here and kept as an artifact, to run again
      # with go test -run=FuzzName/<file> once put in the same place.
      - name: Show the inputs that failed a fuzz test
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/fuzz-failures"
          git ls-files --others --exclude-standard -- '*/testdata/fuzz/*' | while read -r f; do
            echo "== $f"; cat "$f"; cp --parents "$f" "$RUNNER_TEMP/fuzz-failures/"
          done
      - name: Keep the inputs that failed a fuzz test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: fuzz-failures-go-${{ matrix.go }}
          path: ${{ runner.temp }}/fuzz-failures
          if-no-files-found: ignore

  # The booklet as one PDF (make booklet: tools/booklet), kept as an
  # artifact; the release workflow attaches it to the release.
  booklet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0           # tags, for the version on its title page
      - name: Release notes of the newest tag (tools/release-notes.sh, as release.yml runs it)
        run: tools/release-notes.sh "$(git describe --tags --abbrev=0)" "${{ github.repository }}"
      - name: Build the booklet
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
          make booklet booklet-proof
      - name: Keep the booklet (and its copy to proofread)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: kukel-booklet
          path: |
            dist/kukel-booklet-*.pdf
            dist/booklet-proof-*.pdf

  # What is Windows' own: the fs module (locks with LockFileEx, chmod's
  # read-only flag, temporary files, its messages) and a kukel.exe that
  # runs. Failing lines also become annotations (::error::), which the
  # public API shows without the log.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with:
          go-version: stable
      - name: Test the fs module
        shell: bash
        run: |
          set +e
          go test -count=1 -v ./internal/modules/fsmod > test.log 2>&1
          status=$?
          cat test.log
          if [ $status -ne 0 ]; then
            # the output of each failing test only (not of the skipped ones)
            awk '/^=== RUN/ { n = 0; next } /^--- FAIL/ { for (i = 0; i < n; i++) print buf[i]; print; next } { buf[n++] = $0 } /^panic/ { p = 1 } p' test.log |
              head -60 | sed -e 's/%/%25/g' -e 's/^/::error::/'
          fi
          exit $status
      - name: Build kukel.exe and run a program
        shell: bash
        run: |
          go build -o kukel.exe ./cmd/kukel
          ./kukel.exe version
          printf 'use fs;\n\nmain() {\n    with (local f = fs::temp()) {\n        f->lock();\n        f->println(program());\n        f->seek(0);\n        print(f->read());\n    }\n}\n' > smoke.kkl
          ./kukel.exe run smoke.kkl
