name: Release

# A tag v1.2.3 runs the whole CI (ci.yml); only when it passes are the
# archives built (make dist), and the booklet as a PDF (make booklet), and
# published as the GitHub release of the tag, with the logo above the
# tag's section of CHANGELOG.md and a link to the commits since the
# previous tag (tools/release-notes.sh; a tag without a section is not
# released). A release that already exists (made by hand) gets the files
# added, and keeps its notes. The Docker image (Dockerfile)
# is built for linux/amd64 and linux/arm64 and pushed to ghcr.io as :v1.2.3, and as :latest when the tag is the newest
# release (not one with a "-", such as v1.3.0-rc1).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write              # to make the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
      - name: Make the notes (the tag's section of CHANGELOG.md; none stops the release)
        run: tools/release-notes.sh "${{ github.ref_name }}" "${{ github.repository }}" > "$RUNNER_TEMP/notes.md"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e   # v7.0.0
        with:
          go-version: stable
      - name: Build the archives
        run: make dist VERSION=${{ github.ref_name }}
      - name: Build the booklet (a PDF; SHA256SUMS made again with it)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
          make booklet VERSION=${{ github.ref_name }}
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "kukel $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
          fi

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write              # to push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0           # the tags, to tell whether this one is the newest
      - name: Build and push the image
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${REPO,,}"
          tags=(--tag "$image:$TAG")
          newest=$(git tag --list 'v*' | grep -v -e '-' | sort -V | tail -n 1)
          if [[ "$TAG" != *-* && "$TAG" == "$newest" ]]; then
            tags+=(--tag "$image:latest")
          fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # A builder that can push an image for several platforms; BuildKit
          # pinned to a digest (v0.33.1).
          docker buildx create --use --driver docker-container \
            --driver-opt image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          docker buildx build --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$TAG" \
            --label org.opencontainers.image.version="$TAG" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            "${tags[@]}" --push .
