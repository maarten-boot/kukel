# Kukel for Geany: highlighting, the symbol list, comments, and the build
# menu (check, run, format). See README.md here for how to install it.
[styling]
default=default
comment=comment
commentline=comment_line
commentdoc=comment_doc
preprocessorcomment=comment
preprocessorcommentdoc=comment_doc
number=number_1
word=keyword_1
word2=keyword_2
string=string_1
stringraw=string_2
character=character
userliteral=other
uuid=other
# the C lexer takes a line that starts with # for the preprocessor; in
# Kukel it is a comment (#!/usr/bin/env kukel too)
preprocessor=comment_line
operator=operator
identifier=identifier_1
stringeol=string_eol
verbatim=string_2
regex=regex
commentlinedoc=comment_line_doc
commentdockeyword=comment_doc_keyword
commentdockeyworderror=comment_doc_keyword_error
globalclass=class
tripleverbatim=string_2
hashquotedstring=string_2
taskmarker=comment
escapesequence=string_1

[keywords]
# all items must be in one line
primary=break case catch class const continue default do else false finally fn for global if in local new nil return static switch this throw true try use while with yield
# the built-in functions
secondary=abs appendfile atan2 ceil char classof clock cos delete eprint eprintln exit exp find float floor getenv haskey insert instanceof int join keys len log lower max min ord pop pow print println program push randint random readfile readline remove replace round seed sin slice sort split sqrt str tan time trim typeof upper values writefile
docComment=

[lexer_properties]
# the whole # line is one style, without C's preprocessor words in it
styling.within.preprocessor=0
lexer.cpp.track.preprocessor=0
lexer.cpp.update.preprocessor=0
lexer.cpp.escape.sequence=1

[settings]
lexer_filetype=C
# the C# parser reads classes and functions best (see README.md)
tag_parser=C#
extension=kkl
mime_type=text/x-kukel

# Ctrl-E comments lines out with // (# works in Kukel too)
comment_single=//
comment_open=/*
comment_close=*/
comment_use_indent=true

# kukel's errors: file.kkl:3:13: message, and in a trace (file.kkl:3)
error_regex=([^ ():]+\.kkl):([0-9]+)

[indentation]
width=4
# 0 is spaces, 1 is tabs, 2 is tab & spaces
type=0

[build-menu]
FT_00_LB=_Check
FT_00_CM=kukel check "%f"
FT_00_WD=
FT_01_LB=_Format
FT_01_CM=kukel fmt -w "%f"
FT_01_WD=
EX_00_LB=_Execute
EX_00_CM=kukel run "%f"
EX_00_WD=%d
